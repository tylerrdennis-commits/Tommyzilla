<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tommyzilla</title>
    <style>
      :root {
        color-scheme: dark;
        --charcoal: #141a1e;
        --panel: rgba(20, 26, 30, 0.82);
        --cyan: #3ee0c5;
        --steel: #d5dde6;
        --dusk: #243038;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--charcoal); }
      body {
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        color: var(--steel);
        overflow: hidden;
      }
      #view { display: block; width: 100%; height: 100%; }
      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 40px;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-family: Impact, "Arial Black", sans-serif;
        font-size: clamp(32px, 4vw, 48px);
        letter-spacing: 0.04em;
        line-height: 0.95;
        color: white;
        text-shadow: 0 0 24px rgba(62, 224, 197, 0.45);
      }
      p { margin: 0; font-size: 18px; max-width: 36rem; text-align: center; }
      button {
        pointer-events: auto;
        min-height: 52px;
        min-width: 180px;
        padding: 0 28px;
        border: 0;
        border-radius: 12px;
        background: var(--cyan);
        color: #08211c;
        font: 700 20px/1 "Segoe UI", sans-serif;
        letter-spacing: 0.06em;
        cursor: pointer;
        box-shadow: 0 8px 28px rgba(62, 224, 197, 0.28);
      }
      button:hover, button:focus-visible {
        outline: 3px solid white;
        outline-offset: 3px;
        filter: brightness(1.08);
      }
      button:active { transform: scale(0.98); }
      .panel {
        pointer-events: none;
        background: var(--panel);
        border: 1px solid rgba(62, 224, 197, 0.35);
        border-radius: 16px;
        padding: 22px 28px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        width: min(440px, calc(100vw - 64px));
      }
      #play-hint {
        position: fixed;
        left: 20px;
        bottom: 20px;
        background: var(--dusk);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 16px;
      }
      #roster {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      .roster-item {
        min-height: 44px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        padding: 0 14px;
        background: var(--dusk);
        color: var(--steel);
        font-size: 18px;
        letter-spacing: 0.02em;
        box-shadow: none;
      }
      .roster-item[aria-pressed="true"] {
        outline: 3px solid var(--cyan);
        outline-offset: 0;
      }
      .swatch {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        border: 1px solid white;
        flex: 0 0 auto;
      }
      .hidden { display: none; }
      #variant-dock {
        position: fixed;
        left: 500px;
        right: 16px;
        bottom: 12px;
        pointer-events: none;
        background: var(--panel);
        border: 1px solid rgba(62, 224, 197, 0.35);
        border-radius: 16px;
        padding: 12px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        max-height: 42vh;
      }
      #variant-dock h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.08em;
        color: white;
      }
      #variant-dock p {
        font-size: 14px;
        line-height: 1.35;
        text-align: left;
        max-width: none;
      }
      #egg-count { font-weight: 700; color: white; }
      #shiny-odds { color: var(--cyan); }
      #egg-block { color: #ffb4a8; font-weight: 700; }
      #shiny-result { color: #ffe56a; }
      #variant-list {
        pointer-events: auto;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        max-width: 100%;
        padding-bottom: 4px;
      }
      .variant-item {
        min-width: 148px;
        min-height: 44px;
        width: auto;
        flex: 0 0 auto;
        padding: 0 12px;
        background: var(--dusk);
        color: var(--steel);
        font-size: 15px;
        letter-spacing: 0.01em;
        box-shadow: none;
      }
      .variant-item[aria-pressed="true"] {
        outline: 3px solid var(--cyan);
        outline-offset: 0;
      }
      .variant-item.shiny {
        box-shadow: inset 0 0 0 2px #ffe56a;
      }
      #shiny-chance { pointer-events: auto; align-self: flex-start; }
      #shiny-chance:disabled {
        background: #3a4448;
        color: #93a0a8;
        cursor: not-allowed;
        box-shadow: none;
        filter: none;
      }
      @media (max-width: 1099px) {
        .hud { justify-content: flex-start; overflow: auto; }
        #variant-dock {
          position: relative;
          left: auto;
          right: auto;
          bottom: auto;
          width: min(440px, calc(100vw - 64px));
          margin-top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div class="hud" id="menu">
      <div class="panel">
        <h1>TOMMYZILLA</h1>
        <p>The name on each hero is the creature on screen. Choose one, then press Play.</p>
        <div id="roster"></div>
        <button id="play" type="button">PLAY</button>
      </div>
      <aside id="variant-dock">
        <h2>VARIANTS</h2>
        <p id="egg-count">Eggs: 30</p>
        <p id="shiny-odds"></p>
        <div id="variant-list"></div>
        <button id="shiny-chance" type="button" aria-describedby="shiny-odds">Spend 10 eggs</button>
        <p id="egg-block" class="hidden" role="status"></p>
        <p id="shiny-result" role="status"></p>
      </aside>
    </div>
    <div id="play-hint" class="hidden"><span id="play-name"></span> is walking. WASD or arrows steer. Esc returns to the title.</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
